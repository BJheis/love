<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安辞与017的恋爱记录树</title>
<style>
  :root {
    --pink: #f9dce1;
    --pink-deep: #f4b8c4;
    --pink-dark: #e08a9b;
    --green: #d9f0e3;
    --green-deep: #8fd1b0;
    --green-dark: #4a9e7a;
    --text: #5a4a4d;
    --white: #fffafb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fdf2f5 0%, #eef8f2 100%);
    min-height: 100vh;
    color: var(--text);
    padding: 24px 16px 60px;
  }

  .container { max-width: 720px; margin: 0 auto; }

  /* 顶部计时器 */
  .timer-box {
    background: var(--white);
    border-radius: 24px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(224, 138, 155, 0.12);
    margin-bottom: 24px;
    border: 2px solid var(--pink);
  }

  .timer-box h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--pink-dark);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }

  .timer-display {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .timer-unit {
    background: linear-gradient(145deg, #fff, var(--pink));
    border-radius: 14px;
    padding: 10px 14px;
    min-width: 62px;
    border: 1px solid var(--pink-deep);
  }

  .timer-unit .num {
    font-size: 20px;
    font-weight: 700;
    color: var(--pink-dark);
    display: block;
  }

  .timer-unit .label {
    font-size: 11px;
    color: #a88b91;
    margin-top: 2px;
  }

  /* 工具栏 */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .toolbar input[type="text"] {
    flex: 1;
    min-width: 150px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2px solid var(--pink);
    background: var(--white);
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }

  .toolbar input[type="text"]:focus { border-color: var(--green-deep); }

  .btn {
    padding: 12px 18px;
    border-radius: 14px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-pink {
    background: var(--pink-deep);
    color: #fff;
  }

  .btn-pink:hover { background: var(--pink-dark); }

  .btn-green {
    background: var(--green-deep);
    color: #fff;
  }

  .btn-green:hover { background: var(--green-dark); }

  .btn-outline {
    background: var(--white);
    color: var(--pink-dark);
    border: 2px solid var(--pink);
  }

  .btn-outline:hover { background: var(--pink); }

  /* 卡片 */
  .card {
    background: var(--white);
    border-radius: 18px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(224, 138, 155, 0.1);
    border-left: 6px solid var(--green-deep);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .card:hover { box-shadow: 0 6px 20px rgba(224, 138, 155, 0.2); }

  .card-header {
    padding: 16px 18px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--pink-dark);
    flex: 1;
    word-break: break-word;
  }

  .card-date {
    font-size: 12px;
    color: #b09a9f;
    white-space: nowrap;
  }

  .card-body {
    padding: 0 18px 16px;
    display: none;
    font-size: 14px;
    line-height: 1.8;
    color: #6e5c60;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .card.open .card-body { display: block; }

  .card-actions {
    display: flex;
    gap: 8px;
    padding: 0 18px 14px;
    flex-wrap: wrap;
  }

  .mini-btn {
    padding: 6px 12px;
    border-radius: 10px;
    border: none;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }

  .mini-edit { background: var(--green); color: var(--green-dark); }
  .mini-edit:hover { background: var(--green-deep); color: #fff; }
  .mini-copy { background: #fdf0e3; color: #c8914a; }
  .mini-copy:hover { background: #f0d4b0; }
  .mini-del { background: #fde8ec; color: var(--pink-dark); }
  .mini-del:hover { background: var(--pink-deep); color: #fff; }

  /* 编辑面板 */
  .editor {
    background: var(--white);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 6px 20px rgba(224, 138, 155, 0.15);
    border: 2px dashed var(--green-deep);
    display: none;
  }

  .editor.show { display: block; }

  .editor h3 {
    font-size: 15px;
    color: var(--green-dark);
    margin-bottom: 14px;
  }

  .editor label {
    display: block;
    font-size: 12px;
    color: #a88b91;
    margin-bottom: 6px;
    margin-top: 12px;
  }

  .editor input[type="text"],
  .editor input[type="datetime-local"],
  .editor textarea {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 2px solid var(--pink);
    background: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border 0.2s;
  }

  .editor input:focus, .editor textarea:focus { border-color: var(--green-deep); }

  .editor textarea { resize: vertical; min-height: 90px; }

  .editor-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  .empty-tip {
    text-align: center;
    padding: 40px 20px;
    color: #c0a8ae;
    font-size: 14px;
  }

  .hidden-file { display: none; }
</style>
</head>
<body>
<div class="container">

  <!-- 顶部计时 -->
  <div class="timer-box">
    <h1>🌿 安辞 &amp; 017 在一起已经 🌸</h1>
    <div class="timer-display" id="timerDisplay">
      <div class="timer-unit"><span class="num" id="tDay">0</span><span class="label">天</span></div>
      <div class="timer-unit"><span class="num" id="tHour">0</span><span class="label">时</span></div>
      <div class="timer-unit"><span class="num" id="tMin">0</span><span class="label">分</span></div>
      <div class="timer-unit"><span class="num" id="tSec">0</span><span class="label">秒</span></div>
    </div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 搜索标题或内容...">
    <button class="btn btn-pink" id="addBtn">＋ 添加卡片</button>
    <button class="btn btn-outline" id="exportBtn">导出</button>
    <button class="btn btn-outline" id="importBtn">导入</button>
    <input type="file" id="importFile" class="hidden-file" accept=".json">
  </div>

  <!-- 编辑面板 -->
  <div class="editor" id="editor">
    <h3 id="editorTitle">添加新卡片</h3>
    <label>时间（卡片会按这个时间排序）</label>
    <input type="datetime-local" id="editDate">
    <label>标题</label>
    <input type="text" id="editTitle" placeholder="给这一天起个标题...">
    <label>内容</label>
    <textarea id="editContent" placeholder="写下想记录的事情..."></textarea>
    <div class="editor-actions">
      <button class="btn btn-green" id="saveBtn">保存</button>
      <button class="btn btn-outline" id="cancelBtn">取消</button>
    </div>
  </div>

  <!-- 卡片列表 -->
  <div id="cardList"></div>
  <div class="empty-tip" id="emptyTip">还没有卡片，点“添加卡片”写下第一笔吧 🌸</div>

</div>

<script>
  // ====== 配置：纪念日起点 ======
  const START_DATE = new Date(2026, 9, 8, 0, 0, 0); // 2026年10月8日 00:00:00

  // ====== 数据管理 ======
  const STORAGE_KEY = 'love_tree_records_v1';
  let records = [];
  let editingId = null; // null 表示新增

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      records = raw ? JSON.parse(raw) : [];
    } catch (e) {
      records = [];
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  // ====== 计时器 ======
  function updateTimer() {
    const now = new Date();
    let diff = Math.floor((now - START_DATE) / 1000);
    if (diff < 0) diff = 0;

    const days = Math.floor(diff / 86400);
    const hours = Math.floor((diff % 86400) / 3600);
    const mins = Math.floor((diff % 3600) / 60);
    const secs = diff % 60;

    document.getElementById('tDay').textContent = days;
    document.getElementById('tHour').textContent = String(hours).padStart(2, '0');
    document.getElementById('tMin').textContent = String(mins).padStart(2, '0');
    document.getElementById('tSec').textContent = String(secs).padStart(2, '0');
  }
  setInterval(updateTimer, 1000);
  updateTimer();

  // ====== 时间格式化 ======
  function formatDate(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    if (isNaN(d)) return isoStr;
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const h = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${day} ${h}:${min}`;
  }

  // ====== 渲染卡片列表 ======
  function render() {
    const list = document.getElementById('cardList');
    const emptyTip = document.getElementById('emptyTip');
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

    // 按时间升序排列；时间相同则按创建时间升序
    let sorted = [...records].sort((a, b) => {
      const ta = new Date(a.date).getTime() || 0;
      const tb = new Date(b.date).getTime() || 0;
      if (ta !== tb) return ta - tb;
      return (a.createdAt || 0) - (b.createdAt || 0);
    });

    // 搜索过滤
    if (keyword) {
      sorted = sorted.filter(r =>
        (r.title || '').toLowerCase().includes(keyword) ||
        (r.content || '').toLowerCase().includes(keyword)
      );
    }

    list.innerHTML = '';
    emptyTip.style.display = sorted.length === 0 ? 'block' : 'none';

    sorted.forEach(rec => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = rec.id;

      card.innerHTML = `
        <div class="card-header">
          <div class="card-title">${escapeHtml(rec.title || '(无标题)')}</div>
          <div class="card-date">${formatDate(rec.date)}</div>
        </div>
        <div class="card-body">${escapeHtml(rec.content || '')}</div>
        <div class="card-actions">
          <button class="mini-btn mini-edit" data-act="edit">编辑</button>
          <button class="mini-btn mini-copy" data-act="copy">复制</button>
          <button class="mini-btn mini-del" data-act="del">删除</button>
        </div>
      `;

      // 点击头部展开/收起
      card.querySelector('.card-header').addEventListener('click', () => {
        card.classList.toggle('open');
      });

      // 按钮事件
      card.querySelectorAll('.mini-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const act = btn.dataset.act;
          if (act === 'edit') openEditor(rec.id);
          if (act === 'copy') copyCard(rec.id);
          if (act === 'del') deleteCard(rec.id);
        });
      });

      list.appendChild(card);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ====== 编辑器 ======
  const editor = document.getElementById('editor');
  const editDate = document.getElementById('editDate');
  const editTitle = document.getElementById('editTitle');
  const editContent = document.getElementById('editContent');

  function openEditor(id = null) {
    editingId = id;
    if (id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;
      document.getElementById('editorTitle').textContent = '编辑卡片';
      editDate.value = toLocalInput(rec.date);
      editTitle.value = rec.title || '';
      editContent.value = rec.content || '';
    } else {
      document.getElementById('editorTitle').textContent = '添加新卡片';
      editDate.value = toLocalInput(new Date().toISOString());
      editTitle.value = '';
      editContent.value = '';
    }
    editor.classList.add('show');
    editor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    editTitle.focus();
  }

  function closeEditor() {
    editor.classList.remove('show');
    editingId = null;
  }

  // 把 ISO 字符串转成 datetime-local 需要的格式
  function toLocalInput(isoStr) {
    const d = new Date(isoStr);
    if (isNaN(d)) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const dateVal = editDate.value;
    const titleVal = editTitle.value.trim();
    const contentVal = editContent.value.trim();

    if (!dateVal) { alert('请选择时间'); return; }
    if (!titleVal && !contentVal) { alert('标题和内容至少写一个吧'); return; }

    const iso = new Date(dateVal).toISOString();

    if (editingId) {
      const rec = records.find(r => r.id === editingId);
      if (rec) {
        rec.date = iso;
        rec.title = titleVal;
        rec.content = contentVal;
      }
    } else {
      records.push({
        id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        date: iso,
        title: titleVal,
        content: contentVal,
        createdAt: Date.now()
      });
    }

    saveData();
    closeEditor();
    render();
  });

  document.getElementById('cancelBtn').addEventListener('click', closeEditor);
  document.getElementById('addBtn').addEventListener('click', () => openEditor(null));

  // ====== 删除 ======
  function deleteCard(id) {
    if (!confirm('确定删除这张卡片吗？')) return;
    records = records.filter(r => r.id !== id);
    saveData();
    render();
  }

  // ====== 复制 ======
  function copyCard(id) {
    const rec = records.find(r => r.id === id);
    if (!rec) return;
    records.push({
      id: 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      date: rec.date,
      title: (rec.title || '') + '（副本）',
      content: rec.content || '',
      createdAt: Date.now()
    });
    saveData();
    render();
  }

  // ====== 搜索 ======
  document.getElementById('searchInput').addEventListener('input', render);

  // ====== 导出 ======
  document.getElementById('exportBtn').addEventListener('click', () => {
    const dataStr = JSON.stringify(records, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const now = new Date();
    const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `恋爱记录_${stamp}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // ====== 导入 ======
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) throw new Error('格式不对');
        if (!confirm('导入会合并到现有记录中，确定继续吗？')) return;
        const existingIds = new Set(records.map(r => r.id));
        imported.forEach(item => {
          if (!item.id) {
            item.id = 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          }
          if (!existingIds.has(item.id)) {
            records.push(item);
          }
        });
        saveData();
        render();
        alert('导入成功！');
      } catch (err) {
        alert('导入失败：文件格式不正确');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ====== 初始化 ======
  loadData();
  render();
</script>
</body>
</html>
